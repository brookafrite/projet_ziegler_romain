<header class="site-header">
  <div class="inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <circle cx="16" cy="16" r="15" />
        <path d="M9.5 22.5C9.5 15 14.5 10 23 9.5c0 8.5-5 13.5-12.5 13.5" />
        <path d="M9.5 22.5l7.5-7.5" />
      </svg>
      <div>
        <span class="brand-name">Carnet de terrain</span>
        <span class="brand-sub">Signalement de pollutions</span>
      </div>
    </div>

    <nav class="nav" aria-label="Navigation principale">
      <a routerLink="/pollutions" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page">Pollutions</a>
      <a routerLink="/pollutions/nouvelle" routerLinkActive="active" ariaCurrentWhenActive="page">Signaler</a>
      <a routerLink="/utilisateurs" routerLinkActive="active" ariaCurrentWhenActive="page">Utilisateurs</a>

      <!-- Partie « compte » : change selon que l'on est connecté ou non -->
      <span class="account">
        @if (authService.currentUser(); as user) {
          <span class="hello">Bonjour {{ user.prenom }}</span>
          <button type="button" class="link" (click)="logout()">Se déconnecter</button>
        } @else {
          <a routerLink="/connexion" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
          <a routerLink="/inscription" routerLinkActive="active" ariaCurrentWhenActive="page">Créer un compte</a>
        }
      </span>
    </nav>
  </div>
</header>

<main class="site-main">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="inner">
    <p>TP Angular. Réalisé par Romain Ziegler.</p>
  </div>
</footer>
