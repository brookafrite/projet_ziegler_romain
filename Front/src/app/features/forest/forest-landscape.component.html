<!-- Le paysage : ciel, soleil (ou lune), collines, puis les arbres du fond vers l'avant -->
<figure class="landscape">
  <svg viewBox="0 0 1000 420" role="group" aria-label="La forêt des pollutions nettoyées">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" class="sky-top" />
        <stop offset="1" class="sky-bottom" />
      </linearGradient>
    </defs>
    <rect width="1000" height="420" fill="url(#sky)" />
    @for (star of stars; track $index) {
      <circle class="star" [attr.cx]="star[0]" [attr.cy]="star[1]" r="1.6" />
    }
    <circle class="sun" cx="860" cy="85" r="34" />
    <!-- Nuages qui dérivent lentement -->
    <g class="cloud drift-1"><ellipse cx="180" cy="80" rx="46" ry="16" /><ellipse cx="210" cy="68" rx="30" ry="18" /></g>
    <g class="cloud drift-2"><ellipse cx="520" cy="55" rx="38" ry="13" /><ellipse cx="545" cy="45" rx="24" ry="14" /></g>
    <g class="cloud drift-1"><ellipse cx="700" cy="140" rx="34" ry="11" /></g>
    <!-- Oiseaux qui traversent le ciel (le jour seulement) -->
    @for (bird of birds; track $index) {
      <!-- La hauteur sur le groupe, le vol (animation CSS) sur le dessin : les deux ne s'écrasent pas -->
      <g [attr.transform]="'translate(0 ' + bird.y + ')'">
        <path class="bird" [style.animation-delay.s]="bird.delay" d="M-8,0 Q-4,-5 0,0 Q4,-5 8,0" />
      </g>
    }

    <!-- Colline du fond, et sa ligne de sapins lointains en silhouette -->
    <path class="hill-back" d="M0,250 C150,190 300,230 450,205 C600,180 800,240 1000,200 L1000,420 L0,420 Z" />
    <path class="tree-line" [attr.d]="treeLinePath" />

    <!-- Colline de devant, avec quelques arbres discrets sur sa crête et des touffes d'herbe -->
    <path class="hill-front" d="M0,290 C200,250 400,300 600,265 C750,240 900,280 1000,260 L1000,420 L0,420 Z" />
    <!-- La rivière : elle sort de derrière la colline et serpente vers nous ; ses reflets coulent -->
    <path class="river" [attr.d]="river.bed" />
    @for (shine of river.shine; track $index) {
      <path class="river-shine" [attr.d]="shine" [style.animation-delay.s]="$index * -1.3" />
    }
    @for (reed of decor.reeds; track $index) {
      <path class="reed" [attr.transform]="'translate(' + reed.x + ' ' + reed.y + ')'" d="M0,0 L-3,-13 M0,0 L1,-17 M0,0 L4,-12" />
    }
    @for (tree of decor.midTrees; track $index) {
      <g class="decor-tree" [attr.transform]="'translate(' + tree.x + ' ' + tree.y + ') scale(' + tree.scale + ')'">
        <ng-container [ngTemplateOutlet]="treeShape" [ngTemplateOutletContext]="{ $implicit: tree.kind }" />
      </g>
    }
    @for (tuft of decor.tufts; track $index) {
      <path class="tuft" [attr.transform]="'translate(' + tuft.x + ' ' + tuft.y + ')'" d="M-4,0 L-6,-7 M0,0 L0,-9 M4,0 L6,-7" />
    }

    <!-- Les animaux du fond (cerf sur la colline, canards sur l'eau) : derrière les arbres -->
    @for (animal of fauna().animals; track animal.kind; let i = $index) {
      @if (animal.back) {
        <g class="animal" [attr.transform]="'translate(' + animal.x + ' ' + animal.y + ') scale(' + animal.scale + ')'">
          <title>{{ animalLabel(animal) }}</title>
          <g class="appear" [style.animation-delay.ms]="animalDelay(i)">
            <ng-container [ngTemplateOutlet]="animalShape" [ngTemplateOutletContext]="{ $implicit: animal.kind }" />
          </g>
        </g>
      }
    }

    @if (trees().length === 0) {
      <!-- Pas encore d'arbre planté : une petite pousse au milieu -->
      <g class="sprout" transform="translate(560 340)">
        <path d="M0,0 L0,-26" />
        <path d="M0,-14 C-12,-16 -18,-26 -18,-32 C-8,-30 0,-24 0,-14 Z" />
        <path d="M0,-20 C10,-22 16,-32 16,-38 C6,-36 0,-30 0,-20 Z" />
      </g>
    }

    <!-- Les vrais arbres : un par pollution nettoyée, colorés et cliquables -->
    @for (tree of trees(); track tree.pollution.id) {
      <g class="tree" role="link" tabindex="0" [attr.aria-label]="label(tree)"
         [attr.transform]="'translate(' + tree.x + ' ' + tree.y + ') scale(' + tree.scale + ')'"
         (click)="open(tree)" (keydown.enter)="open(tree)">
        <title>{{ label(tree) }}</title>
        <!-- La pousse : l'arbre grandit depuis son pied, l'un après l'autre, puis se balance au vent -->
        <g class="grow" [style.animation-delay.ms]="tree.delay">
          <ellipse class="shadow" cx="0" cy="0" rx="20" ry="4" />
          <g class="sway" [style.animation-delay.ms]="swayDelay(tree)">
            <ng-container [ngTemplateOutlet]="treeShape" [ngTemplateOutletContext]="{ $implicit: tree.kind }" />
          </g>
          @if (isNew(tree)) {
            <!-- Planté cette semaine -->
            <path class="new-star" d="M0,-96 L3,-89 L10,-86 L3,-83 L0,-76 L-3,-83 L-10,-86 L-3,-89 Z" />
          }
        </g>
      </g>
    }

    <!-- Premier plan : buissons, et lucioles la nuit -->
    @for (bush of decor.bushes; track $index) {
      <g class="bush" [attr.transform]="'translate(' + bush.x + ' ' + bush.y + ') scale(' + bush.scale + ')'">
        <circle cx="-9" cy="-6" r="9" /><circle cx="8" cy="-7" r="10" /><circle cx="0" cy="-13" r="10" />
      </g>
    }
    <!-- Les animaux du premier plan : devant les arbres -->
    @for (animal of fauna().animals; track animal.kind; let i = $index) {
      @if (!animal.back) {
        <g class="animal" [attr.transform]="'translate(' + animal.x + ' ' + animal.y + ') scale(' + animal.scale + ')'">
          <title>{{ animalLabel(animal) }}</title>
          <g class="appear" [style.animation-delay.ms]="animalDelay(i)">
            <ng-container [ngTemplateOutlet]="animalShape" [ngTemplateOutletContext]="{ $implicit: animal.kind }" />
          </g>
        </g>
      }
    }
    @for (fly of fireflies; track $index) {
      <circle class="firefly" [attr.cx]="fly[0]" [attr.cy]="fly[1]" r="2.2" [style.animation-delay.ms]="$index * -450" />
    }

    <!-- Les animaux, dessinés une seule fois ; le pied (0, 0) au sol, tournés vers la droite -->
    <ng-template #animalShape let-kind>
      @switch (kind) {
        @case ('lapin') {
          <svg:g class="hop">
            <svg:ellipse class="rabbit" cx="6" cy="-19" rx="1.8" ry="5.5" transform="rotate(-12 6 -19)" />
            <svg:ellipse class="rabbit" cx="9" cy="-19" rx="1.8" ry="5.5" transform="rotate(10 9 -19)" />
            <svg:ellipse class="rabbit" cx="0" cy="-7" rx="9" ry="6.5" />
            <svg:circle class="rabbit" cx="8" cy="-12" r="4.5" />
            <svg:circle class="white" cx="-9" cy="-9" r="2.6" />
            <svg:circle class="eye" cx="9.8" cy="-13" r="0.9" />
          </svg:g>
        }
        @case ('canards') {
          @for (duck of [[-8, 0, 1], [9, 3, 0.85]]; track $index) {
            <svg:g [attr.transform]="'translate(' + duck[0] + ' ' + duck[1] + ') scale(' + duck[2] + ')'">
              <svg:g class="bob" [style.animation-delay.s]="$index * -1.1">
                <svg:ellipse class="duck" cx="0" cy="-3" rx="7" ry="3.5" />
                <svg:circle class="duck-head" cx="5" cy="-8" r="2.8" />
                <svg:path class="beak" d="M7.5,-8.5 L11,-7.6 L7.5,-6.8 Z" />
              </svg:g>
            </svg:g>
          }
        }
        @case ('renard') {
          <svg:g class="tail-sway">
            <svg:ellipse class="fox" cx="-16" cy="-10" rx="8" ry="3.5" transform="rotate(-20 -16 -10)" />
            <svg:circle class="white" cx="-23" cy="-12.5" r="2.4" />
          </svg:g>
          <svg:path class="dark-leg" d="M-6,-6 v6 M-3,-6 v6 M5,-6 v6 M8,-6 v6" />
          <svg:ellipse class="fox" cx="0" cy="-9" rx="10" ry="4.5" />
          <svg:path class="fox" d="M9,-13 L10.5,-19 L13,-14 Z" />
          <svg:circle class="fox" cx="11" cy="-11" r="4" />
          <svg:path class="fox" d="M13,-12.5 L19,-10 L13,-8 Z" />
          <svg:circle class="eye" cx="12.3" cy="-12" r="0.8" />
        }
        @case ('cerf') {
          <svg:path class="deer-leg" d="M-9,-12 v12 M-5,-12 v12 M6,-12 v12 M10,-12 v12" />
          <svg:ellipse class="deer" cx="0" cy="-15" rx="12" ry="5.5" />
          <svg:circle class="white" cx="-12" cy="-17" r="1.8" />
          <svg:g class="graze">
            <svg:path class="deer" d="M7,-18 L11,-29 L15,-28 L12,-14 Z" />
            <svg:ellipse class="deer" cx="15" cy="-30" rx="5" ry="3" />
            <svg:path class="antler" d="M12,-32 L10,-40 M10,-37 L7,-40 M11,-38 L13,-42 M15,-32 L16,-40 M16,-37 L19,-39" />
          </svg:g>
        }
        @case ('hibou') {
          <!-- Sur sa souche ; la nuit, ses yeux brillent -->
          <svg:rect class="stump" x="-8" y="-12" width="16" height="12" />
          <svg:ellipse class="stump-top" cx="0" cy="-12" rx="8" ry="2.5" />
          <svg:path class="owl" d="M-5,-27 L-6,-33 L-2,-29 Z M5,-27 L6,-33 L2,-29 Z" />
          <svg:ellipse class="owl" cx="0" cy="-21" rx="6.5" ry="8.5" />
          <svg:g class="blink">
            <svg:circle class="owl-eye" cx="-2.6" cy="-24" r="2.4" />
            <svg:circle class="owl-eye" cx="2.6" cy="-24" r="2.4" />
            <svg:circle class="eye" cx="-2.6" cy="-24" r="1" />
            <svg:circle class="eye" cx="2.6" cy="-24" r="1" />
          </svg:g>
          <svg:path class="beak" d="M-1,-21.5 L1,-21.5 L0,-19.5 Z" />
        }
        @case ('papillons') {
          @for (fly of [[0, -20], [-30, -5]]; track $index) {
            <svg:g [attr.transform]="'translate(' + fly[0] + ' ' + fly[1] + ')'">
              <svg:g class="flutter-path" [style.animation-delay.s]="$index * -4">
                <svg:g class="flap" [class.second]="$index === 1">
                  <svg:ellipse class="wing" cx="-3" cy="-2" rx="3" ry="2.6" />
                  <svg:ellipse class="wing" cx="3" cy="-2" rx="3" ry="2.6" />
                  <svg:ellipse class="wing" cx="-2" cy="1.5" rx="2" ry="1.6" />
                  <svg:ellipse class="wing" cx="2" cy="1.5" rx="2" ry="1.6" />
                </svg:g>
              </svg:g>
            </svg:g>
          }
        }
      }
    </ng-template>

    <!-- Les 3 espèces, dessinées une seule fois : pour les vrais arbres et pour le décor -->
    <ng-template #treeShape let-kind>
      @switch (kind) {
        @case ('sapin') {
          <svg:rect class="trunk" x="-3" y="-14" width="6" height="14" />
          <svg:polygon class="leaves dark" points="0,-74 -22,-30 22,-30" />
          <svg:polygon class="leaves dark" points="0,-54 -19,-12 19,-12" />
        }
        @case ('feuillu') {
          <svg:rect class="trunk" x="-4" y="-28" width="8" height="28" />
          <svg:circle class="leaves" cx="-13" cy="-38" r="14" />
          <svg:circle class="leaves" cx="13" cy="-38" r="14" />
          <svg:circle class="leaves" cx="0" cy="-50" r="19" />
        }
        @case ('bouleau') {
          <svg:rect class="trunk birch" x="-3" y="-42" width="6" height="42" />
          <svg:path class="birch-mark" d="M-3,-30 h3 M0,-18 h3 M-3,-8 h3" />
          <svg:ellipse class="leaves light" cx="0" cy="-58" rx="15" ry="22" />
        }
      }
    </ng-template>
  </svg>
  <figcaption class="hint">
    Survolez un arbre pour voir la pollution qu'il représente, cliquez pour ouvrir sa fiche.
    <span class="next-animal">{{ nextAnimalHint() }}</span>
  </figcaption>
</figure>
